llm_config:
  base_url: https://api.deepseek.com/
  api_key: ""
  model_name: deepseek-reasoner
  temperature: 0.7
  max_tokens: 8192
agent_config:
  max_iterations: 20
  max_plan_steps: 5
  max_tool_calls_per_run: 12
  max_retries: 3
  max_search_results: 10
  context_compact_threshold_tokens: 24000
  context_hard_limit_tokens: 32000
  context_keep_recent_tokens: 8000
  context_summary_max_tokens: 4000
  context_summary_max_retries: 2
  # 当前模型官方tokenizer.json在容器内的路径；为空时使用字符估算
  context_tokenizer_path: null
mcp_config:
  mcpServers:
    amap-maps-streamableHTTP:
      transport: streamable_http
      enabled: false
      description: null
      env: null
      command: null
      args: null
      url: https://mcp.amap.com/mcp?key=YOUR_AMAP_KEY
      headers: null
a2a_config:
  a2a_servers: []
